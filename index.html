<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell-App</title>
    <link rel="stylesheet" href="./styles/standards.css">
    <link rel="shortcut icon" href="./image/icon/clinteastwood-meal-2411129_640.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="headerImage">
            <figure>
                <img src="./image/img/suggabearsclub-africa-9904843_640.png" alt="Logo">
                <figcaption>Mama'Afrika</figcaption>
            </figure> 
        </div>
        <div class="headerIcon">
            <img src="./image/icon/menu_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="basket icon">
        </div>
    </header>
    <main id="mainContent">
        <section class="headSection">
            <div class="mainBanner">
                <img src="./image/img/buffetcrush-christmas-wallpaper-2009590_640.jpg" alt="header backgroundimage">
                <img src="./image/icon/clker-free-vector-images-place-setting-309980_640.png" alt="icon">
            </div>   
        </section>
        <section class="mainSectioon">
                <div class="mainSectionHeader">
                    <h1>Mama'Afrika Menü:</h1>
                    <p>Hier kannst du deine Bestellung überprüfen und anpassen.</p>
                    <p><span class="higlight">Hinweis:</span> Es gibt nur zwei Hauptgerichte — <span class="higlight">Fufu</span> und <span class="higlight">Jollofreis</span>. Alle weiteren Optionen sind Beilagen, die Sie nach Wunsch auswählen können.</p>
                </div>

        </section>
        <section class="footerSection"></section>
    </main>
    <footer></footer>
    
</body>
</html>
